<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal de Controles</title>
<meta name="theme-color" content="#1d6b47">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#16201b;--muted:#66736d;--line:#e3e9e6;--card:#ffffffe6;
  --brand:#1d6b47;--brand-dark:#14502f;--brand-soft:#e3f1e8;--crit:#c0392b;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --sh:0 1px 2px #16201b0a,0 10px 30px #16201b14;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--ink);font-size:15px;line-height:1.45;min-height:100vh;display:grid;place-items:center;padding:24px 16px;
  background:radial-gradient(1200px 700px at 0% 0%,#d9efe2 0%,transparent 60%),radial-gradient(900px 600px at 100% 10%,#e2ecf3 0%,transparent 60%),radial-gradient(900px 700px at 60% 100%,#eef3e4 0%,transparent 60%),#f3f6f4;background-attachment:fixed}
[hidden]{display:none!important}
.card{width:100%;max-width:400px;background:var(--card);backdrop-filter:blur(14px);border-radius:22px;box-shadow:var(--sh);padding:32px 28px 26px}
.eyebrow{margin:0 0 6px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:-.02em}
.sub{margin:0 0 24px;color:var(--muted)}
label{display:block;font-weight:600;font-size:.88rem;margin:0 0 6px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);margin-bottom:16px}
input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
button{width:100%;font:inherit;font-weight:700;padding:13px;border:0;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer;margin-top:4px}
button:hover{background:var(--brand-dark)}
button:disabled{opacity:.6;cursor:progress}
.msg{margin:14px 0 0;font-size:.9rem;min-height:1.3em}
.msg.err{color:var(--crit)}
.msg.ok{color:var(--brand)}
footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.78rem;text-align:center}
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">Mineral do Brasil · ITM</p>
  <h1>Portal de Controles</h1>
  <p class="sub">Entre com seu usuário e senha.</p>
  <form id="f" autocomplete="on" onsubmit="return false">
    <label for="usuario">Usuário</label>
    <input id="usuario" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit" disabled>Entrar</button>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </form>
  <footer>Versão de teste · os dados ficam criptografados no site</footer>
</main>
<script src="cripto.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const SESSAO="portal.sessao",VERSAO="portal.versaoDados",HORAS=12;
const APPS=["rt-reports","controle-floculantes.v1","controle-britadores.v1","controle-ibm.v1","controle-itm.v1","controle-testes.v1"];
const PROPRIAS=new Set([SESSAO,VERSAO]);
const msg=(t,c)=>{$("msg").className="msg"+(c?" "+c:"");$("msg").textContent=t};

/* para onde voltar depois do login (só páginas deste mesmo site) */
function destino(){
  try{const v=new URLSearchParams(location.search).get("volta");if(v){const u=new URL(v,location.href);if(u.origin===location.origin)return u.href}}catch(e){}
  return "index.html";
}
function idbGravar(nome,store,obj){return new Promise((ok,err)=>{
  const r=indexedDB.open(nome,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(store))r.result.createObjectStore(store)};
  r.onerror=()=>err(r.error);
  r.onsuccess=()=>{const db=r.result;const t=db.transaction(store,"readwrite");const s=t.objectStore(store);Object.keys(obj).forEach(k=>s.put(obj[k],k));t.oncomplete=()=>{db.close();ok()};t.onerror=()=>{db.close();err(t.error)}};
})}
async function restaurar(bk){
  const ls=Object.entries(bk.localStorage||{}).filter(([k])=>!PROPRIAS.has(k));
  ls.forEach(([k])=>localStorage.removeItem(k));
  ls.forEach(([k,v])=>localStorage.setItem(k,v));
  for(const [chave,obj] of Object.entries(bk.indexedDB||{})){const [db,store]=chave.split("/");await idbGravar(db,store,obj)}
}
const dataBR=iso=>{const d=new Date(iso);return d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})};

/* já logado: segue direto */
try{const s=JSON.parse(localStorage.getItem(SESSAO)||"null");if(s&&s.ate>Date.now()){location.replace(destino());return}}catch(e){}

if(!window.crypto||!crypto.subtle||!window.DecompressionStream){
  msg("Este navegador não tem o necessário para abrir o portal. Use o Chrome ou o Edge atualizados.","err");$("btn").disabled=true;return;
}

$("f").onsubmit=async ev=>{
  ev.preventDefault();
  const usuario=$("usuario").value,senha=$("senha").value;
  $("btn").disabled=true;msg("Conferindo…");
  try{
    let arq;
    try{const r=await fetch("dados.enc.json",{cache:"no-store"});if(!r.ok)throw new Error(r.status);arq=await r.json()}
    catch(e){msg(location.protocol==="file:"?"Abra pelo endereço do site (o login não funciona abrindo o arquivo direto).":"O arquivo de acesso (dados.enc.json) ainda não foi publicado.","err");return}
    const chave=await PortalCripto.entrar(arq,usuario,senha);
    if(!chave){msg("Usuário ou senha incorretos.","err");$("senha").select();return}

    /* dados publicados: carrega neste navegador quando houver versão nova */
    if(arq.dados&&localStorage.getItem(VERSAO)!==arq.publicadoEm){
      const temDados=APPS.some(k=>localStorage.getItem(k)!=null);
      const trocar=!temDados||confirm(`Há dados publicados em ${dataBR(arq.publicadoEm)}.\n\nCarregar esses dados neste navegador? O que foi lançado aqui e não está na publicação será substituído.\n\nOK = carregar · Cancelar = manter os dados deste navegador`);
      if(trocar){msg("Carregando os dados…");await restaurar(await PortalCripto.abrirDados(arq,chave))}
      localStorage.setItem(VERSAO,arq.publicadoEm);
    }
    localStorage.setItem(SESSAO,JSON.stringify({usuario:PortalCripto.normUsuario(usuario),ate:Date.now()+HORAS*36e5}));
    msg("Pronto!","ok");
    location.replace(destino());
  }catch(e){console.error(e);msg("Não foi possível entrar ("+(e.message||e)+").","err")}
  finally{$("btn").disabled=false}
};
$("btn").disabled=false;
})();
</script>
</body>
</html>
